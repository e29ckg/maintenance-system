<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบแจ้งซ่อมบำรุง</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
    .card { border-radius: 12px; border: none; }
  </style>
</head>
<body>
  <div id="app" class="container py-4 max-w-md">
    <h3 class="text-center mb-4 text-primary fw-bold">ระบบแจ้งซ่อมบำรุง</h3>

    <!-- ส่วนที่ 1: ฟอร์มแจ้งซ่อม (ตัดแผนกออก) -->
    <div class="card shadow-sm mb-4">
      <div class="card-body p-4">
        <h5 class="card-title fw-bold mb-3">ฟอร์มแจ้งปัญหา</h5>
        <form @submit.prevent="submitTicket">
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">ชื่อผู้แจ้ง</label>
            <input type="text" class="form-control" v-model="form.requesterName" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">สถานที่ / อุปกรณ์</label>
            <input type="text" class="form-control" v-model="form.location" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">อาการที่พบ</label>
            <textarea class="form-control" v-model="form.problem" rows="3" required></textarea>
          </div>
          
          <!-- ช่องแนบรูปภาพ -->
          <div class="mb-4">
            <label class="form-label text-muted small fw-bold">แนบรูปภาพ (ถ้ามี)</label>
            <input type="file" class="form-control" accept="image/*" @change="handleFileUpload">
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 py-2 fw-bold" :disabled="isSubmitting">
            <span v-if="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
            {{ isSubmitting ? 'กำลังบันทึกข้อมูล...' : 'ส่งข้อมูลแจ้งซ่อม' }}
          </button>
        </form>
      </div>
    </div>

    <!-- ส่วนที่ 2: รายการแจ้งซ่อมล่าสุด -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">รหัสงาน</th>
                <th>วันที่แจ้ง</th>
                <th>ผู้แจ้ง</th>
                <th>อาการ</th>
                <th>สถานะ</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="isLoading">
                <td colspan="4" class="text-center py-4 text-muted">
                  <div class="spinner-border text-primary spinner-border-sm me-2"></div> กำลังโหลดข้อมูล...
                </td>
              </tr>
              <tr v-for="ticket in tickets" :key="ticket.ticketId">
                <td class="ps-3"><small class="text-muted">{{ ticket.ticketId }}</small></td>
                <td>{{ ticket.requestDate }}</td>
                <td>{{ ticket.requesterName }}</td>
                <td>
                  <div class="fw-bold">{{ ticket.location }}</div>
                  <div class="text-muted small">{{ ticket.problem }}</div>
                </td>
                <td>
                  <span class="badge" 
                        :class="{
                          'bg-warning text-dark': ticket.status === 'รอดำเนินการ',
                          'bg-info text-dark': ticket.status === 'กำลังดำเนินการ',
                          'bg-danger': ticket.status === 'รออะไหล่',
                          'bg-success': ticket.status === 'เสร็จสิ้น',
                          'bg-secondary': ticket.status === 'ยกเลิก'
                        }">
                    {{ ticket.status }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHuR7e7nFvybHZVt97oZBn6IgIwRMwtz6VbXibRnCsHsk8dyoxGI25biJatiDCyjwaXw/exec';

    const { createApp } = Vue;

    createApp({
      data() {
        return {
          form: {
            requesterName: '',
            location: '',
            problem: '',
            fileData: null // เก็บข้อมูลรูปภาพ
          },
          tickets: [],
          isLoading: true,
          isSubmitting: false
        }
      },
      mounted() {
        this.fetchTickets();
      },
      methods: {
        // ดึงข้อมูลจาก GAS Backend
        fetchTickets() {
          this.isLoading = true;
          fetch(API_URL + '?action=getTickets')
            .then(response => response.json())
            .then(data => {
              this.tickets = data.map(t => ({ ...t, isUpdating: false })).reverse();
              this.isLoading = false;
            })
            .catch(error => {
              console.error('Error:', error);
              this.isLoading = false;
            });
        },
        
        // ฟังก์ชันแปลงรูปภาพเป็น Base64
        handleFileUpload(event) {
          const file = event.target.files[0];
          if (!file) {
            this.form.fileData = null;
            return;
          }

          const reader = new FileReader();
          reader.onload = (e) => {
            const dataUrl = e.target.result;
            const base64Data = dataUrl.split(',')[1]; 
            
            this.form.fileData = {
              filename: file.name,
              mimeType: file.type,
              base64: base64Data
            };
          };
          reader.readAsDataURL(file);
        },

        // ส่งข้อมูลบันทึกลง Sheet
        submitTicket() {
          this.isSubmitting = true;
          fetch(API_URL, {
            method: 'POST',
            // ป้องกันปัญหา CORS โดยใช้ text/plain
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
            body: JSON.stringify({
              action: 'addTicket',
              formData: this.form
            })
          })
          .then(response => response.json())
          .then(res => {
            this.isSubmitting = false;
            if(res.success) {
              Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'รหัส: ' + res.ticketId });
              this.form = { requesterName: '', location: '', problem: '', fileData: null };
              this.fetchTickets();
            }
          });
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
